[project]
name = "ai-engineer"
version = "0.1.0"
description = ""
authors = [
    {name = "GM",email = "giuseppemumolo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "numpy (>=2.5.2,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "openai (>=3.6.0,<4.0.0)",
]

[tool.poetry]
packages = [{include = "ai_engineer", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
